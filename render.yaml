# Blueprint Render: satu web service gratis untuk dasbor.
# File menit Google tidak ada di Git: unggah sebagai Secret File "menit_google.json" (lihat README, bagian Deploy).
services:
  - type: web
    name: dashboard-pos-gawat-darurat-bekasi
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: gunicorn app:server --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
